<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicTrustHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f5f9 45%, #e2e8f0 100%);
    }

    /* Skeuomorphic tactile input container */
    .skeuo-search-container {
      background: linear-gradient(145deg, #ffffff, #f0f4f8);
      box-shadow: 
        8px 8px 20px rgba(163, 177, 198, 0.45),
        -8px -8px 20px rgba(255, 255, 255, 0.95),
        inset 1px 1px 2px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Inset field well */
    .skeuo-input {
      box-shadow: 
        inset 2px 2px 5px rgba(163, 177, 198, 0.3),
        inset -2px -2px 5px rgba(255, 255, 255, 0.8);
      background: #f8fafc;
    }

    /* Skeuomorphic WhatsApp-style send button */
    .skeuo-send-btn {
      background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
      box-shadow: 
        3px 3px 8px rgba(21, 128, 61, 0.35),
        -2px -2px 6px rgba(255, 255, 255, 0.8),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.15s ease-in-out;
    }

    .skeuo-send-btn:hover {
      background: linear-gradient(135deg, #25d366 0%, #16a34a 100%);
      box-shadow: 
        4px 4px 12px rgba(21, 128, 61, 0.45),
        -2px -2px 8px rgba(255, 255, 255, 0.9),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
      transform: translateY(-1px);
    }

    .skeuo-send-btn:active {
      background: linear-gradient(135deg, #15803d 0%, #166534 100%);
      box-shadow: 
        inset 2px 2px 5px rgba(0, 0, 0, 0.3),
        inset -1px -1px 3px rgba(255, 255, 255, 0.2);
      transform: translateY(1px);
    }

    /* Skeuomorphic tactile verdict card */
    .skeuo-card {
      background: linear-gradient(145deg, #ffffff, #f8fafc);
      box-shadow: 
        10px 10px 25px rgba(163, 177, 198, 0.35),
        -10px -10px 25px rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Title emboss */
    .skeuo-title {
      color: #1e293b;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9), 0 -1px 0 rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-12 px-4 selection:bg-green-500 selection:text-white">

  <!-- Brand Title placed high up with strong identity -->
  <header class="w-full text-center pt-2">
    <h1 class="skeuo-title text-4xl sm:text-5xl font-extrabold tracking-tight">
      CivicTrustHub
    </h1>
  </header>

  <!-- Main Content Area with generous gap from header -->
  <main class="w-full max-w-xl flex flex-col items-center -mt-16 sm:-mt-24 space-y-8">
    
    <!-- Search Form with WhatsApp-style send icon & skeuomorphic white design -->
    <form onsubmit="handleSearch(event)" class="w-full">
      <div class="skeuo-search-container p-2.5 rounded-full flex items-center gap-2">
        <input 
          type="text" 
          id="rumorInput" 
          placeholder="Search or enter a rumor..." 
          class="skeuo-input flex-1 px-6 py-4 rounded-full text-slate-800 placeholder-slate-400 focus:outline-none text-base border-none"
          required
        />
        
        <!-- WhatsApp-style Send Button -->
        <button 
          type="submit" 
          id="submitBtn" 
          title="Send"
          class="skeuo-send-btn w-13 h-13 p-3.5 rounded-full text-white flex items-center justify-center shrink-0 cursor-pointer"
        >
          <!-- WhatsApp send arrow icon -->
          <svg class="w-5 h-5 translate-x-0.5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
    </form>

    <!-- Loading State -->
    <div id="loadingIndicator" class="hidden flex-col items-center justify-center space-y-3 py-4">
      <div class="w-8 h-8 border-3 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Verifying Rumor...</p>
    </div>

    <!-- Skeuomorphic Result Card -->
    <div id="resultBox" class="hidden skeuo-card w-full max-w-sm p-6 rounded-3xl text-center transition-all duration-300">
      <span class="text-[11px] font-bold uppercase tracking-widest text-slate-400 block mb-1">Status</span>
      <div id="verdictText" class="text-3xl font-extrabold tracking-wider"></div>
    </div>

  </main>

  <!-- Empty balanced footer space -->
  <div class="h-6"></div>

  <script>
    async function handleSearch(e) {
      e.preventDefault();
      
      const input = document.getElementById('rumorInput').value.trim();
      if (!input) return;

      const loading = document.getElementById('loadingIndicator');
      const resultBox = document.getElementById('resultBox');
      const verdictText = document.getElementById('verdictText');
      const submitBtn = document.getElementById('submitBtn');

      // Hide previous result and show loading
      resultBox.classList.add('hidden');
      loading.classList.remove('hidden');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-60', 'cursor-not-allowed');

      try {
        let isTrue = false;
        let details = '';

        // 1. Try local FastAPI backend if running
        let backendOk = false;
        try {
          const res = await fetch('http://127.0.0.1:8000/api/rumors/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: input })
          });
          if (res.ok) {
            const data = await res.json();
            isTrue = !data.is_unverified;
            details = data.ground_truth ? data.ground_truth.text : '';
            backendOk = true;
          }
        } catch (err) {
          backendOk = false;
        }

        // 2. Client-side real-time evidence fallback (Works on GitHub Pages)
        if (!backendOk) {
          const clean = input.replace(/[^a-zA-Z0-9\s]/g, ' ').trim();
          const qLower = clean.toLowerCase();
          const qWords = qLower.split(/\s+/).filter(w => w.length > 2);

          const isDisasterOrCrisis = /flood|cyclone|earthquake|storm|dam|rain|fire|accident|landslide|submerged|outage|epidemic|hospital|evacuate/.test(qLower);

          const wikiUrl = `https://en.wikipedia.org/w/api.php?origin=*&action=query&list=search&srsearch=${encodeURIComponent(clean)}&format=json&utf8=1`;
          const res = await fetch(wikiUrl);
          if (res.ok) {
            const data = await res.json();
            const items = (data.query && data.query.search) || [];
            
            let bestRatio = 0.0;
            let isFiction = false;

            items.slice(0, 5).forEach(item => {
              const textLower = (item.snippet + ' ' + item.title).toLowerCase();
              let hits = 0;
              qWords.forEach(w => { if (textLower.includes(w)) hits++; });
              const r = hits / Math.max(qWords.length, 1);
              if (r > bestRatio) bestRatio = r;
              if (item.title.toLowerCase().includes('(film)') || item.title.toLowerCase().includes('(song)')) {
                isFiction = true;
              }
            });

            if (isDisasterOrCrisis && bestRatio >= 0.65) {
              isTrue = true;
            } else if (isFiction && !qLower.includes('film') && !qLower.includes('movie')) {
              isTrue = false;
            } else if (bestRatio >= 0.85 && !isFiction) {
              isTrue = true;
            } else {
              isTrue = false;
            }
          }
        }

        if (isTrue) {
          verdictText.textContent = "TRUE";
          verdictText.className = "text-4xl font-black text-emerald-600 tracking-wider";
        } else {
          verdictText.textContent = "FALSE";
          verdictText.className = "text-4xl font-black text-rose-600 tracking-wider";
        }

        resultBox.classList.remove('hidden');
      } catch (err) {
        console.error('Verification error:', err);
        verdictText.textContent = "FALSE";
        verdictText.className = "text-4xl font-black text-rose-600 tracking-wider";
        resultBox.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
      }
    }
  </script>

</body>
</html>
