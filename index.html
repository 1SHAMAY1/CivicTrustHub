<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicTrustHub – Real-Time Rumor Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      /* Clean white center fading outwards into a sleek dark/black vignette border */
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f1f5f9 35%, #94a3b8 70%, #1e293b 88%, #090d16 100%);
      min-height: 100vh;
      color: #0f172a;
    }

    /* Tactile container with clean white core and dark ambient gradient depth */
    .skeuo-search-container {
      background: linear-gradient(145deg, #ffffff, #edf2f7);
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.45),
        0 10px 20px -10px rgba(15, 23, 42, 0.25),
        inset 1px 1px 2px rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .skeuo-input {
      box-shadow: 
        inset 2px 2px 5px rgba(15, 23, 42, 0.12),
        inset -2px -2px 5px rgba(255, 255, 255, 0.9);
      background: #f8fafc;
      color: #0f172a;
    }

    .skeuo-input::placeholder {
      color: #64748b;
    }

    .skeuo-send-btn {
      background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
      box-shadow: 
        3px 4px 10px rgba(21, 128, 61, 0.4),
        -1px -1px 4px rgba(255, 255, 255, 0.8),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.15s ease-in-out;
    }

    .skeuo-send-btn:hover {
      background: linear-gradient(135deg, #25d366 0%, #16a34a 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(34, 197, 94, 0.45);
    }

    .skeuo-send-btn:active {
      background: linear-gradient(135deg, #15803d 0%, #166534 100%);
      transform: translateY(1px);
    }

    .skeuo-card {
      background: linear-gradient(145deg, #ffffff, #f8fafc);
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.35),
        0 10px 20px -5px rgba(0, 0, 0, 0.15),
        inset 1px 1px 2px rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(226, 232, 240, 0.85);
    }

    .skeuo-title {
      color: #0f172a;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9), 0 2px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-12 px-4 selection:bg-green-500 selection:text-white">

  <!-- Brand Title -->
  <header class="w-full text-center pt-2">
    <h1 class="skeuo-title text-4xl sm:text-5xl font-extrabold tracking-tight">
      CivicTrustHub
    </h1>
    <p class="text-xs uppercase tracking-widest text-slate-500 font-semibold mt-1">Real-Time Corroboration Engine</p>
  </header>

  <!-- Main Content Area -->
  <main class="w-full max-w-xl flex flex-col items-center -mt-16 sm:-mt-24 space-y-8">
    
    <!-- Search Form -->
    <form onsubmit="handleSearch(event)" class="w-full">
      <div class="skeuo-search-container p-2.5 rounded-full flex items-center gap-2">
        <input 
          type="text" 
          id="rumorInput" 
          maxlength="300"
          placeholder="Search rumor (e.g. Cyclone alert, school holiday, दिल्ली बाढ़)..." 
          class="skeuo-input flex-1 px-6 py-4 rounded-full text-slate-800 placeholder-slate-400 focus:outline-none text-base border-none"
          required
        />
        
        <button 
          type="submit" 
          id="submitBtn" 
          title="Verify Claim"
          class="skeuo-send-btn w-12 h-12 rounded-full text-white flex items-center justify-center shrink-0 cursor-pointer"
        >
          <svg class="w-5 h-5 translate-x-0.5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
    </form>

    <!-- Loading State -->
    <div id="loadingIndicator" class="hidden flex flex-col items-center justify-center space-y-3 py-4">
      <div class="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs uppercase tracking-wider text-slate-600 font-semibold">Corroborating across live sources...</p>
    </div>

    <!-- 3-State Verdict Card -->
    <div id="resultBox" class="hidden skeuo-card w-full max-w-md p-6 rounded-3xl text-center transition-all duration-300">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Verification Verdict</span>
        <span id="confidenceBadge" class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200"></span>
      </div>
      
      <!-- Verdict Display -->
      <div id="verdictText" class="text-3xl sm:text-4xl font-black tracking-wider my-1"></div>
      
      <!-- Classification Sub-heading -->
      <p id="classificationText" class="text-xs font-semibold text-slate-500 mt-1 mb-3"></p>

      <!-- Source Evidence Container -->
      <div id="evidenceContainer" class="mt-3 pt-3 border-t border-slate-100 text-left hidden">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Source Evidence</span>
        <p id="evidenceText" class="text-xs text-slate-700 leading-relaxed italic bg-slate-50 p-3 rounded-xl border border-slate-200/60"></p>
        
        <!-- Regional Hindi Advisory -->
        <div id="hindiContainer" class="mt-2 text-left hidden">
          <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500 block mb-1">हिंदी सूचना (Regional Advisory)</span>
          <p id="hindiText" class="text-xs text-slate-700 bg-amber-50/60 p-2.5 rounded-lg border border-amber-200/60 leading-relaxed"></p>
        </div>
      </div>
    </div>

  </main>

  <div class="h-6"></div>

  <script>
    // Configurable API base for deployed backends (e.g. Render / Railway / Hugging Face Spaces)
    const API_BASE = window.API_BASE || (['localhost', '127.0.0.1'].includes(window.location.hostname) ? 'http://127.0.0.1:8000' : '');

    // Robust Unicode text cleaning preserving Indic letters and combining marks
    function cleanUnicodeText(str) {
      return str.replace(/’/g, "'").replace(/[^\p{L}\p{N}\s\?']/gu, ' ').trim();
    }

    async function handleSearch(e) {
      e.preventDefault();
      
      const input = document.getElementById('rumorInput').value.trim();
      if (!input) return;

      const loading = document.getElementById('loadingIndicator');
      const resultBox = document.getElementById('resultBox');
      const verdictText = document.getElementById('verdictText');
      const confidenceBadge = document.getElementById('confidenceBadge');
      const classificationText = document.getElementById('classificationText');
      const evidenceContainer = document.getElementById('evidenceContainer');
      const evidenceText = document.getElementById('evidenceText');
      const hindiContainer = document.getElementById('hindiContainer');
      const hindiText = document.getElementById('hindiText');
      const submitBtn = document.getElementById('submitBtn');

      resultBox.classList.add('hidden');
      evidenceContainer.classList.add('hidden');
      hindiContainer.classList.add('hidden');
      loading.classList.remove('hidden');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-60', 'cursor-not-allowed');

      try {
        const rawTrim = input.trim();
        const cleanRaw = cleanUnicodeText(rawTrim).toLowerCase();
        const cleanNoPunct = cleanRaw.replace(/\?/g, '').trim();
        const rawWords = cleanNoPunct.split(/\s+/).filter(Boolean);

        // Conversational & Greeting Filter (Unicode-aware, handles typos like 'slef', slang 'how u')
        const commonGreetings = ['hi', 'hello', 'hey', 'test', 'testing', 'good morning', 'good afternoon', 'good evening', 'bye', 'ok', 'okay', 'yes', 'no'];
        const isGreeting = commonGreetings.includes(cleanNoPunct);
        const isNumbersOnly = /^\d+$/.test(cleanNoPunct);
        const isTooShort = rawWords.length < 2 || cleanNoPunct.length < 5;

        const isConversational = 
          /(\btell me\b|\babout your\b|\babout yourself\b|\babout ur\b|\babout slef\b|\bwho are you\b|\bwho r u\b|\bwho is this\b|\bhow to use\b|\byou are good\b|\byou r good\b)/i.test(cleanNoPunct) ||
          /^(how\s*(r|are|u|you)|what\s*(s|\'s|up|r|is)|who\s*(r|is|u)|sup|wbu)\b/i.test(cleanNoPunct) ||
          /^(well\s+|so\s+|hey\s+)?(tell\s+me|who\s+are|how\s+to)/i.test(cleanNoPunct);

        if (isGreeting || isTooShort || isNumbersOnly || isConversational) {
          verdictText.textContent = "Please check rumors only.";
          verdictText.className = "text-xl sm:text-2xl font-bold text-amber-600 tracking-normal py-2";
          confidenceBadge.textContent = "Invalid Query";
          confidenceBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200";
          classificationText.textContent = "Conversational prompt or non-assertion query detected.";
          resultBox.classList.remove('hidden');
          return;
        }

        // Only strip leading question auxiliary if the sentence ends with '?' (preserves 'Will Smith')
        let normalizedQuery = cleanNoPunct;
        if (rawTrim.endsWith('?')) {
          normalizedQuery = cleanNoPunct.replace(/^(is|are|was|were|did|does|will|can|has|have)\s+/i, '').trim();
        }
        if (!normalizedQuery) normalizedQuery = cleanNoPunct;

        let verdict = "UNVERIFIED";
        let classification = "";
        let confidenceScore = null;
        let evidenceSnippet = "";
        let counterHi = "";

        // 1. Try FastAPI Backend (25s timeout for model loading on cold starts)
        let backendOk = false;
        const targetUrl = API_BASE ? `${API_BASE}/api/rumors/verify` : '/api/rumors/verify';

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 25000);
          const res = await fetch(targetUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: input }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            if (data.is_invalid) {
              verdictText.textContent = data.message || "Please check rumors only.";
              verdictText.className = "text-xl sm:text-2xl font-bold text-amber-600 tracking-normal py-2";
              confidenceBadge.textContent = "Invalid Query";
              confidenceBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200";
              classificationText.textContent = data.ground_truth ? data.ground_truth.text : "";
              resultBox.classList.remove('hidden');
              return;
            }
            verdict = data.verdict || "UNVERIFIED";
            classification = data.classification || "";
            confidenceScore = data.confidence || null;
            evidenceSnippet = data.ground_truth ? `${data.ground_truth.source}: "${data.ground_truth.text}"` : "";
            counterHi = data.counter_hi || "";
            backendOk = true;
          }
        } catch (err) {
          backendOk = false;
        }

        // 2. Client-side Real-time Web Evidence Fallback (Degraded Mode)
        if (!backendOk) {
          const qLower = normalizedQuery.toLowerCase();
          const qWords = qLower.split(/\s+/).filter(w => w.length > 2);

          const wikiUrl = `https://en.wikipedia.org/w/api.php?origin=*&action=query&list=search&srsearch=${encodeURIComponent(normalizedQuery)}&format=json&utf8=1`;
          try {
            const res = await fetch(wikiUrl);
            if (res.ok) {
              const data = await res.json();
              const items = (data.query && data.query.search) || [];
              
              let bestRatio = 0.0;
              let topItem = null;

              items.slice(0, 6).forEach(item => {
                const fullContent = (item.title + ' ' + item.snippet).toLowerCase();
                let hits = 0;
                qWords.forEach(w => { if (fullContent.includes(w)) hits++; });
                const r = hits / Math.max(qWords.length, 1);
                if (r > bestRatio) {
                  bestRatio = r;
                  topItem = item;
                }
              });

              if (topItem) {
                const stripped = topItem.snippet.replace(/<[^>]+>/g, '').replace(/&quot;/g, '"').replace(/&#039;/g, "'").trim();
                evidenceSnippet = `${topItem.title}: "${stripped}"`;
              }

              const snippetLower = evidenceSnippet.toLowerCase();
              const currentYear = new Date().getFullYear();

              const queryHasNegation = /\b(not|never|no|unmarried|unreleased|fake|false|hoax|disproved)\b|n't\b/i.test(qLower);
              const snippetHasNegation = /\b(not|never|no|unmarried|unreleased|unsubstantiated|fake|false|rumor|denied)\b|n't\b/i.test(snippetLower);

              const isClaimingPastEvent = /\b(released|launched|won|died|killed|premiered|happened)\b/i.test(qLower);
              const futureYearRegex = new RegExp(`\\b(${currentYear + 1}|${currentYear + 2}|${currentYear + 3})\\b`);
              const isFutureInSnippet = /\b(to be released|will be released|being released in|scheduled for|slated for|anticipated in)\b/i.test(snippetLower) ||
                                        futureYearRegex.test(snippetLower);

              const isMarriageClaim = /\bmarri(ed|age)\b|\bwedding\b/i.test(qLower);

              if (isClaimingPastEvent && isFutureInSnippet && !qLower.includes('future') && !qLower.includes('upcoming')) {
                verdict = "CONTRADICTED";
                classification = "CONTRADICTED – Event scheduled for future, not yet occurred.";
                confidenceScore = null;
                evidenceSnippet += " (Source clarifies event is an upcoming announcement).";
              } else if (isMarriageClaim && !queryHasNegation) {
                const mentionsUnmarried = /\b(unmarried|bachelor|single|never married|not married)\b/i.test(snippetLower);
                const relativesOnly = /\b(brother|sister|father|mother|daughter|son|wife of|husband of)\b/i.test(snippetLower);
                if (mentionsUnmarried || relativesOnly) {
                  verdict = "CONTRADICTED";
                  classification = "CONTRADICTED – Biographical records do not verify this marriage.";
                  confidenceScore = null;
                } else {
                  verdict = "UNVERIFIED";
                  classification = "UNVERIFIED – Inconclusive marital dispatches.";
                }
              } else if (bestRatio >= 0.45) {
                if (queryHasNegation) {
                  if (snippetHasNegation || (!snippetLower.includes('wife') && !snippetLower.includes('husband'))) {
                    verdict = "VERIFIED";
                    classification = "VERIFIED – Corroborated with official negative records.";
                  } else {
                    verdict = "CONTRADICTED";
                    classification = "CONTRADICTED – Disputed by reported dispatches.";
                  }
                } else {
                  if (snippetHasNegation) {
                    verdict = "CONTRADICTED";
                    classification = "CONTRADICTED – Reported records dispute this claim.";
                  } else {
                    verdict = "VERIFIED";
                    classification = "VERIFIED – Corroborated by live knowledge sources.";
                  }
                }
                confidenceScore = Number(bestRatio.toFixed(2));
              } else {
                verdict = "UNVERIFIED";
                classification = "UNVERIFIED – Insufficient corroborating records found.";
                confidenceScore = null;
                if (!evidenceSnippet) {
                  evidenceSnippet = "No corroborating public dispatches or emergency records confirm this claim.";
                }
              }
            } else {
              verdict = "NETWORK_ERROR";
              classification = "Wikipedia query was not reachable.";
              evidenceSnippet = "Network issue retrieving live knowledge index. Please retry.";
            }
          } catch (netErr) {
            verdict = "NETWORK_ERROR";
            classification = "Live knowledge index connection timed out.";
            evidenceSnippet = "Please verify your internet connection and try again.";
          }
        }

        // Render 3-State Verdict
        if (verdict === "VERIFIED") {
          verdictText.textContent = "VERIFIED";
          verdictText.className = "text-3xl sm:text-4xl font-black text-emerald-600 tracking-wider";
          confidenceBadge.textContent = confidenceScore ? `${Math.round(confidenceScore * 100)}% Match` : "Corroborated";
          confidenceBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200";
        } else if (verdict === "CONTRADICTED") {
          verdictText.textContent = "CONTRADICTED";
          verdictText.className = "text-3xl sm:text-4xl font-black text-rose-600 tracking-wider";
          confidenceBadge.textContent = confidenceScore ? `${Math.round(confidenceScore * 100)}% Contradiction` : "Refuted";
          confidenceBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200";
        } else if (verdict === "NETWORK_ERROR") {
          verdictText.textContent = "UNAVAILABLE";
          verdictText.className = "text-2xl sm:text-3xl font-bold text-amber-700 tracking-normal py-1";
          confidenceBadge.textContent = "Network Error";
          confidenceBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-800 border border-amber-300";
        } else {
          verdictText.textContent = "UNVERIFIED";
          verdictText.className = "text-3xl sm:text-4xl font-black text-amber-500 tracking-wider";
          confidenceBadge.textContent = "No Confirmation";
          confidenceBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200";
        }

        classificationText.textContent = classification;

        if (evidenceSnippet) {
          evidenceText.textContent = evidenceSnippet;
          evidenceContainer.classList.remove('hidden');
        }

        if (counterHi) {
          hindiText.textContent = counterHi;
          hindiContainer.classList.remove('hidden');
        }

        resultBox.classList.remove('hidden');
      } catch (err) {
        console.error('Execution notice:', err);
        verdictText.textContent = "UNAVAILABLE";
        verdictText.className = "text-2xl sm:text-3xl font-bold text-slate-700 tracking-normal py-1";
        confidenceBadge.textContent = "Execution Error";
        confidenceBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200";
        classificationText.textContent = "Temporary execution error occurred while scanning dispatches.";
        evidenceContainer.classList.add('hidden');
        hindiContainer.classList.add('hidden');
        resultBox.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
      }
    }
  </script>

</body>
</html>
