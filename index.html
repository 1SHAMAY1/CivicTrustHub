<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicTrustHub – Real-Time Rumor Detector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f5f9 45%, #e2e8f0 100%);
    }

    /* Skeuomorphic tactile input container */
    .skeuo-search-container {
      background: linear-gradient(145deg, #ffffff, #f0f4f8);
      box-shadow: 
        8px 8px 20px rgba(163, 177, 198, 0.45),
        -8px -8px 20px rgba(255, 255, 255, 0.95),
        inset 1px 1px 2px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .skeuo-input {
      box-shadow: 
        inset 2px 2px 5px rgba(163, 177, 198, 0.3),
        inset -2px -2px 5px rgba(255, 255, 255, 0.8);
      background: #f8fafc;
    }

    .skeuo-send-btn {
      background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
      box-shadow: 
        3px 3px 8px rgba(21, 128, 61, 0.35),
        -2px -2px 6px rgba(255, 255, 255, 0.8),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.15s ease-in-out;
    }

    .skeuo-send-btn:hover {
      background: linear-gradient(135deg, #25d366 0%, #16a34a 100%);
      transform: translateY(-1px);
    }

    .skeuo-send-btn:active {
      background: linear-gradient(135deg, #15803d 0%, #166534 100%);
      transform: translateY(1px);
    }

    .skeuo-card {
      background: linear-gradient(145deg, #ffffff, #f8fafc);
      box-shadow: 
        10px 10px 25px rgba(163, 177, 198, 0.35),
        -10px -10px 25px rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .skeuo-title {
      color: #1e293b;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9), 0 -1px 0 rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-12 px-4 selection:bg-green-500 selection:text-white">

  <!-- Brand Title -->
  <header class="w-full text-center pt-2">
    <h1 class="skeuo-title text-4xl sm:text-5xl font-extrabold tracking-tight">
      CivicTrustHub
    </h1>
    <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold mt-1">Real-Time Rumor Detection & Fact Corroboration</p>
  </header>

  <!-- Main Content Area -->
  <main class="w-full max-w-xl flex flex-col items-center -mt-16 sm:-mt-24 space-y-8">
    
    <!-- Rumor Verification Input Form -->
    <form onsubmit="handleVerify(event)" class="w-full">
      <div class="skeuo-search-container p-2.5 rounded-full flex items-center gap-2">
        <input 
          type="text" 
          id="rumorInput" 
          maxlength="500"
          placeholder="Paste suspicious forward, viral claim, or news rumor..." 
          class="skeuo-input flex-1 px-6 py-4 rounded-full text-slate-800 placeholder-slate-400 focus:outline-none text-base border-none"
          required
        />
        
        <button 
          type="submit" 
          id="submitBtn" 
          title="Detect Rumor"
          class="skeuo-send-btn w-12 h-12 rounded-full text-white flex items-center justify-center shrink-0 cursor-pointer"
        >
          <svg class="w-5 h-5 translate-x-0.5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
    </form>

    <!-- Loading State -->
    <div id="loadingIndicator" class="hidden flex flex-col items-center justify-center space-y-3 py-4">
      <div class="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Running dual fact-check & multi-source news verification...</p>
    </div>

    <!-- Rumor Detector Verdict Card -->
    <div id="resultBox" class="hidden skeuo-card w-full max-w-md p-6 rounded-3xl text-center transition-all duration-300">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Rumor Verdict</span>
        <span id="sourcesBadge" class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200"></span>
      </div>
      
      <!-- Verdict Display -->
      <div id="verdictText" class="text-3xl sm:text-4xl font-black tracking-wider my-1"></div>
      
      <!-- Classification Sub-heading -->
      <p id="classificationText" class="text-xs font-semibold text-slate-500 mt-1 mb-2"></p>

      <!-- Rumor Cue Badges Container -->
      <div id="cuesContainer" class="flex flex-wrap gap-1.5 justify-center my-3 hidden"></div>

      <!-- Source Evidence Container -->
      <div id="evidenceContainer" class="mt-3 pt-3 border-t border-slate-100 text-left hidden">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Corroborating Dispatches</span>
        <p id="evidenceText" class="text-xs text-slate-700 leading-relaxed italic bg-slate-50 p-3 rounded-xl border border-slate-200/60"></p>
        
        <!-- Regional Advisory -->
        <div id="hindiContainer" class="mt-2 text-left hidden">
          <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-1">हिंदी परामर्श (Regional Advisory)</span>
          <p id="hindiText" class="text-xs text-slate-600 bg-amber-50/50 p-2.5 rounded-lg border border-amber-200/50 leading-relaxed"></p>
        </div>
      </div>
    </div>

  </main>

  <div class="h-6"></div>

  <script>
    // Configurable API base for deployed backends
    const API_BASE = window.API_BASE || (['localhost', '127.0.0.1'].includes(window.location.hostname) ? 'http://127.0.0.1:8000' : '');

    // Robust Unicode text cleaning preserving Indic letters and combining marks
    function cleanUnicodeText(str) {
      return str.replace(/’/g, "'").replace(/[^\p{L}\p{N}\s\?']/gu, ' ').trim();
    }

    async function handleVerify(e) {
      e.preventDefault();
      
      const input = document.getElementById('rumorInput').value.trim();
      if (!input) return;

      const loading = document.getElementById('loadingIndicator');
      const resultBox = document.getElementById('resultBox');
      const verdictText = document.getElementById('verdictText');
      const sourcesBadge = document.getElementById('sourcesBadge');
      const classificationText = document.getElementById('classificationText');
      const cuesContainer = document.getElementById('cuesContainer');
      const evidenceContainer = document.getElementById('evidenceContainer');
      const evidenceText = document.getElementById('evidenceText');
      const hindiContainer = document.getElementById('hindiContainer');
      const hindiText = document.getElementById('hindiText');
      const submitBtn = document.getElementById('submitBtn');

      resultBox.classList.add('hidden');
      evidenceContainer.classList.add('hidden');
      hindiContainer.classList.add('hidden');
      cuesContainer.classList.add('hidden');
      cuesContainer.innerHTML = '';
      loading.classList.remove('hidden');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-60', 'cursor-not-allowed');

      try {
        const rawTrim = input.trim();
        const cleanRaw = cleanUnicodeText(rawTrim).toLowerCase();
        const cleanNoPunct = cleanRaw.replace(/\?/g, '').trim();
        const rawWords = cleanNoPunct.split(/\s+/).filter(Boolean);

        // Conversational & Greeting Filter
        const commonGreetings = ['hi', 'hello', 'hey', 'test', 'testing', 'good morning', 'good afternoon', 'good evening', 'bye', 'ok', 'okay', 'yes', 'no'];
        const isGreeting = commonGreetings.includes(cleanNoPunct);
        const isNumbersOnly = /^\d+$/.test(cleanNoPunct);
        const isTooShort = rawWords.length < 2 || cleanNoPunct.length < 5;

        const isConversational = 
          /(\btell me\b|\babout your\b|\babout yourself\b|\babout ur\b|\babout slef\b|\bwho are you\b|\bwho r u\b|\bwho is this\b|\bhow to use\b|\byou are good\b|\byou r good\b)/i.test(cleanNoPunct) ||
          /^(how\s*(r|are|u|you)|what\s*(s|\'s|up|r|is)|who\s*(r|is|u)|sup|wbu)\b/i.test(cleanNoPunct) ||
          /^(well\s+|so\s+|hey\s+)?(tell\s+me|who\s+are|how\s+to)/i.test(cleanNoPunct);

        if (isGreeting || isTooShort || isNumbersOnly || isConversational) {
          verdictText.textContent = "Please check rumors only.";
          verdictText.className = "text-xl sm:text-2xl font-bold text-amber-600 tracking-normal py-2";
          sourcesBadge.textContent = "Invalid Query";
          sourcesBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200";
          classificationText.textContent = "Conversational prompt or non-assertion query detected.";
          resultBox.classList.remove('hidden');
          return;
        }

        let verdict = "UNCONFIRMED";
        let classification = "";
        let evidenceSnippet = "";
        let counterHi = "";
        let cues = [];
        let sourcesCount = 0;

        // Call Backend API
        let backendOk = false;
        const targetUrl = API_BASE ? `${API_BASE}/api/rumors/verify` : '/api/rumors/verify';

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 25000);
          const res = await fetch(targetUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: input }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            if (data.is_invalid) {
              verdictText.textContent = data.message || "Please check rumors only.";
              verdictText.className = "text-xl sm:text-2xl font-bold text-amber-600 tracking-normal py-2";
              sourcesBadge.textContent = "Invalid Query";
              sourcesBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200";
              classificationText.textContent = data.ground_truth ? data.ground_truth.text : "";
              resultBox.classList.remove('hidden');
              return;
            }
            verdict = data.verdict || "UNCONFIRMED";
            classification = data.classification || "";
            evidenceSnippet = data.ground_truth ? `${data.ground_truth.source}: "${data.ground_truth.text}"` : "";
            counterHi = data.counter_hi || "";
            cues = (data.cues && data.cues.flags) || [];
            sourcesCount = data.sources_count || 0;
            backendOk = true;
          }
        } catch (err) {
          backendOk = false;
        }

        // Failsafe Fallback (Degraded Mode: Never falsely verifies, defaults to UNCONFIRMED)
        if (!backendOk) {
          verdict = "UNAVAILABLE";
          classification = "Verification backend temporarily unreachable. Please retry.";
          evidenceSnippet = "Network connection to verification streams timed out. Please check connection.";
          sourcesBadge.textContent = "Offline";
          sourcesBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200";
        }

        // Render Rumor Cue Badges
        if (cues.length > 0) {
          cuesContainer.innerHTML = cues.map(c => 
            `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-100/70 text-amber-800 border border-amber-300" title="${c.desc}">⚠️ ${c.label}</span>`
          ).join('');
          cuesContainer.classList.remove('hidden');
        }

        // Render Honest Rumor Verdicts
        if (verdict === "CONFIRMED") {
          verdictText.textContent = "CONFIRMED";
          verdictText.className = "text-3xl sm:text-4xl font-black text-emerald-600 tracking-wider";
          sourcesBadge.textContent = sourcesCount >= 2 ? `${sourcesCount} Sources Corroborated` : "Corroborated";
          sourcesBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200";
        } else if (verdict.includes("RUMOR (debunked)")) {
          verdictText.textContent = "RUMOR (Debunked)";
          verdictText.className = "text-2xl sm:text-3xl font-black text-rose-600 tracking-wider";
          sourcesBadge.textContent = "Debunked";
          sourcesBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200";
        } else if (verdict === "LIKELY RUMOR") {
          verdictText.textContent = "LIKELY RUMOR";
          verdictText.className = "text-2xl sm:text-3xl font-black text-rose-500 tracking-wider";
          sourcesBadge.textContent = "Unsubstantiated Forward";
          sourcesBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-600 border border-rose-200";
        } else if (verdict === "NETWORK_ERROR" || verdict === "UNAVAILABLE") {
          verdictText.textContent = "UNAVAILABLE";
          verdictText.className = "text-2xl sm:text-3xl font-bold text-amber-700 tracking-normal py-1";
          sourcesBadge.textContent = "Network Error";
          sourcesBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-800 border border-amber-300";
        } else {
          // UNCONFIRMED
          verdictText.textContent = "UNCONFIRMED";
          verdictText.className = "text-3xl sm:text-4xl font-black text-amber-500 tracking-wider";
          sourcesBadge.textContent = sourcesCount > 0 ? `${sourcesCount} Source (Uncorroborated)` : "No Coverage";
          sourcesBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200";
        }

        classificationText.textContent = classification;

        if (evidenceSnippet) {
          evidenceText.textContent = evidenceSnippet;
          evidenceContainer.classList.remove('hidden');
        }

        if (counterHi) {
          hindiText.textContent = counterHi;
          hindiContainer.classList.remove('hidden');
        }

        resultBox.classList.remove('hidden');
      } catch (err) {
        console.error('Execution notice:', err);
        verdictText.textContent = "UNAVAILABLE";
        verdictText.className = "text-2xl sm:text-3xl font-bold text-slate-700 tracking-normal py-1";
        sourcesBadge.textContent = "Execution Error";
        sourcesBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200";
        classificationText.textContent = "Temporary execution error occurred while scanning dispatches.";
        evidenceContainer.classList.add('hidden');
        hindiContainer.classList.add('hidden');
        resultBox.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
      }
    }
  </script>

</body>
</html>
