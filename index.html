<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicTrustHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f5f9 45%, #e2e8f0 100%);
    }

    /* Skeuomorphic tactile input container */
    .skeuo-search-container {
      background: linear-gradient(145deg, #ffffff, #f0f4f8);
      box-shadow: 
        8px 8px 20px rgba(163, 177, 198, 0.45),
        -8px -8px 20px rgba(255, 255, 255, 0.95),
        inset 1px 1px 2px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Inset field well */
    .skeuo-input {
      box-shadow: 
        inset 2px 2px 5px rgba(163, 177, 198, 0.3),
        inset -2px -2px 5px rgba(255, 255, 255, 0.8);
      background: #f8fafc;
    }

    /* Skeuomorphic WhatsApp-style send button */
    .skeuo-send-btn {
      background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
      box-shadow: 
        3px 3px 8px rgba(21, 128, 61, 0.35),
        -2px -2px 6px rgba(255, 255, 255, 0.8),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      transition: all 0.15s ease-in-out;
    }

    .skeuo-send-btn:hover {
      background: linear-gradient(135deg, #25d366 0%, #16a34a 100%);
      box-shadow: 
        4px 4px 12px rgba(21, 128, 61, 0.45),
        -2px -2px 8px rgba(255, 255, 255, 0.9),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
      transform: translateY(-1px);
    }

    .skeuo-send-btn:active {
      background: linear-gradient(135deg, #15803d 0%, #166534 100%);
      box-shadow: 
        inset 2px 2px 5px rgba(0, 0, 0, 0.3),
        inset -1px -1px 3px rgba(255, 255, 255, 0.2);
      transform: translateY(1px);
    }

    /* Skeuomorphic tactile verdict card */
    .skeuo-card {
      background: linear-gradient(145deg, #ffffff, #f8fafc);
      box-shadow: 
        10px 10px 25px rgba(163, 177, 198, 0.35),
        -10px -10px 25px rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Title emboss */
    .skeuo-title {
      color: #1e293b;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9), 0 -1px 0 rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-12 px-4 selection:bg-green-500 selection:text-white">

  <!-- Brand Title placed high up with strong identity -->
  <header class="w-full text-center pt-2">
    <h1 class="skeuo-title text-4xl sm:text-5xl font-extrabold tracking-tight">
      CivicTrustHub
    </h1>
  </header>

  <!-- Main Content Area with generous gap from header -->
  <main class="w-full max-w-xl flex flex-col items-center -mt-16 sm:-mt-24 space-y-8">
    
    <!-- Search Form with WhatsApp-style send icon & skeuomorphic white design -->
    <form onsubmit="handleSearch(event)" class="w-full">
      <div class="skeuo-search-container p-2.5 rounded-full flex items-center gap-2">
        <input 
          type="text" 
          id="rumorInput" 
          placeholder="Search or enter a rumor..." 
          class="skeuo-input flex-1 px-6 py-4 rounded-full text-slate-800 placeholder-slate-400 focus:outline-none text-base border-none"
          required
        />
        
        <!-- WhatsApp-style Send Button -->
        <button 
          type="submit" 
          id="submitBtn" 
          title="Send"
          class="skeuo-send-btn w-13 h-13 p-3.5 rounded-full text-white flex items-center justify-center shrink-0 cursor-pointer"
        >
          <!-- WhatsApp send arrow icon -->
          <svg class="w-5 h-5 translate-x-0.5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
    </form>

    <!-- Loading State -->
    <div id="loadingIndicator" class="hidden flex-col items-center justify-center space-y-3 py-4">
      <div class="w-8 h-8 border-3 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs uppercase tracking-wider text-slate-500 font-semibold">Verifying Rumor...</p>
    </div>

    <!-- Skeuomorphic Result Card -->
    <div id="resultBox" class="hidden skeuo-card w-full max-w-md p-6 rounded-3xl text-center transition-all duration-300">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Verification Verdict</span>
        <span id="confidenceBadge" class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200"></span>
      </div>
      <div id="verdictText" class="text-4xl font-black tracking-wider my-1"></div>
      
      <!-- Evidence / Source Proof Snippet -->
      <div id="evidenceContainer" class="mt-4 pt-3 border-t border-slate-100 text-left hidden">
        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Source Evidence</span>
        <p id="evidenceText" class="text-xs text-slate-600 leading-relaxed italic bg-slate-50/80 p-3 rounded-xl border border-slate-200/60"></p>
      </div>
    </div>

  </main>

  <!-- Empty balanced footer space -->
  <div class="h-6"></div>

  <script>
    async function handleSearch(e) {
      e.preventDefault();
      
      const input = document.getElementById('rumorInput').value.trim();
      if (!input) return;

      const loading = document.getElementById('loadingIndicator');
      const resultBox = document.getElementById('resultBox');
      const verdictText = document.getElementById('verdictText');
      const confidenceBadge = document.getElementById('confidenceBadge');
      const evidenceContainer = document.getElementById('evidenceContainer');
      const evidenceText = document.getElementById('evidenceText');
      const submitBtn = document.getElementById('submitBtn');

      // Hide previous result and show loading
      resultBox.classList.add('hidden');
      evidenceContainer.classList.add('hidden');
      loading.classList.remove('hidden');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-60', 'cursor-not-allowed');

      try {
        const cleanRaw = input.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').trim();
        const rawWords = cleanRaw.split(/\s+/).filter(Boolean);

        // Edge case detection: greetings, single characters, numbers only, or queries too short/irrelevant
        const commonGreetings = ['hi', 'hello', 'hey', 'test', 'testing', 'how are you', 'who are you', 'good morning', 'good afternoon', 'good evening', 'bye', 'ok', 'okay', 'yes', 'no'];
        const isTooShort = rawWords.length < 2 || cleanRaw.length < 5;
        const isGreeting = commonGreetings.includes(cleanRaw);
        const isNumbersOnly = /^\d+$/.test(cleanRaw);

        if (isGreeting || isTooShort || isNumbersOnly) {
          verdictText.textContent = "Please check rumors only.";
          verdictText.className = "text-xl sm:text-2xl font-bold text-amber-600 tracking-normal py-2";
          confidenceBadge.textContent = "Invalid Query";
          confidenceBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200";
          resultBox.classList.remove('hidden');
          return;
        }

        let isTrue = false;
        let confidenceScore = 0.85;
        let evidenceSnippet = '';

        // 1. Try local FastAPI backend if running
        let backendOk = false;
        try {
          const res = await fetch('http://127.0.0.1:8000/api/rumors/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: input })
          });
          if (res.ok) {
            const data = await res.json();
            isTrue = !data.is_unverified;
            confidenceScore = data.cosine_similarity || 0.85;
            evidenceSnippet = data.ground_truth ? `${data.ground_truth.source}: "${data.ground_truth.text}"` : '';
            backendOk = true;
          }
        } catch (err) {
          backendOk = false;
        }

        // 2. Client-side real-time evidence fallback (Works on GitHub Pages)
        if (!backendOk) {
          const clean = input.replace(/[^a-zA-Z0-9\s]/g, ' ').trim();
          const qLower = clean.toLowerCase();
          const qWords = qLower.split(/\s+/).filter(w => w.length > 2);

          // Intent Detection:
          // A. Crisis & Disasters
          const isCrisis = /flood|cyclone|earthquake|storm|dam|rain|fire|accident|landslide|tsunami|outage|epidemic|hospital|evacuate/.test(qLower);
          
          // B. Release & Media Events (Movies, Albums, Games, Tech, Books)
          const isReleaseOrEvent = /release|released|launch|launched|published|premier|premiere|premiered|screened|won|winner|elected|declared|death|died|killed|massacre|mission/.test(qLower);

          // C. Personal Gossip (Unverified marriage/divorce rumors)
          const isGossipQuery = /(marry|married|dating|affair|husband|wife|secret|wedding)/.test(qLower);

          const wikiUrl = `https://en.wikipedia.org/w/api.php?origin=*&action=query&list=search&srsearch=${encodeURIComponent(clean)}&format=json&utf8=1`;
          const res = await fetch(wikiUrl);
          if (res.ok) {
            const data = await res.json();
            const items = (data.query && data.query.search) || [];
            
            let bestRatio = 0.0;
            let topItem = null;

            items.slice(0, 6).forEach(item => {
              const fullContent = (item.title + ' ' + item.snippet).toLowerCase();
              let hits = 0;
              qWords.forEach(w => { if (fullContent.includes(w)) hits++; });
              const r = hits / Math.max(qWords.length, 1);
              if (r > bestRatio) {
                bestRatio = r;
                topItem = item;
              }
            });

            if (topItem) {
              const stripped = topItem.snippet.replace(/<[^>]+>/g, '').replace(/&quot;/g, '"').replace(/&#039;/g, "'").trim();
              evidenceSnippet = `${topItem.title}: "${stripped}"`;
            }

            // High Precision Decision Rules:
            if (isGossipQuery && !qLower.includes('film') && !qLower.includes('movie')) {
              // Block personal gossip verified only via film synopses
              isTrue = false;
              confidenceScore = 0.88;
            } else if ((isCrisis || isReleaseOrEvent) && bestRatio >= 0.50) {
              // Valid release, public event, gaming lore, or disaster verified by direct public records
              isTrue = true;
              confidenceScore = Math.min(0.96, Math.max(0.70, bestRatio * 1.1));
            } else if (bestRatio >= 0.80) {
              isTrue = true;
              confidenceScore = 0.85;
            } else {
              isTrue = false;
              confidenceScore = Math.max(0.75, (1 - bestRatio));
              if (!evidenceSnippet) {
                evidenceSnippet = "No corroborating public records, emergency dispatches, or media releases confirm this claim.";
              }
            }
          }
        }

        // Render Verdict
        if (isTrue) {
          verdictText.textContent = "TRUE";
          verdictText.className = "text-4xl font-black text-emerald-600 tracking-wider";
          confidenceBadge.textContent = `${Math.round(confidenceScore * 100)}% Confidence`;
          confidenceBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200";
        } else {
          verdictText.textContent = "FALSE";
          verdictText.className = "text-4xl font-black text-rose-600 tracking-wider";
          confidenceBadge.textContent = `${Math.round(confidenceScore * 100)}% Confidence`;
          confidenceBadge.className = "text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200";
        }

        if (evidenceSnippet) {
          evidenceText.textContent = evidenceSnippet;
          evidenceContainer.classList.remove('hidden');
        }

        resultBox.classList.remove('hidden');
      } catch (err) {
        console.error('Verification error:', err);
        verdictText.textContent = "FALSE";
        verdictText.className = "text-4xl font-black text-rose-600 tracking-wider";
        resultBox.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
      }
    }
  </script>

</body>
</html>
